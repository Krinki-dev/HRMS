name: Tenant Migration PostgreSQL Integration

on:
  push:
    branches:
      - architecture/postgres-tenant-isolation
  pull_request:
    branches:
      - main
      - architecture/postgres-tenant-isolation

jobs:
  tenant-migration-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TENANT_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run PostgreSQL migration inventory integration test
        run: node --test test/tenant-migration-inventory.integration.test.js
